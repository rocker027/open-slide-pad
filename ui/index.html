<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Open Slide Pad</title>
<style>
/* SLIDERUST_STYLE */
</style>
</head>
<body>
<aside class="rail" aria-label="Site sidebar" data-i18n-aria-label="網站側欄">
<button class="brand rail-control" id="home-button" title="Open Slide Pad home" data-i18n-title="Open Slide Pad 首頁" aria-label="Home" data-i18n-aria-label="首頁" data-action="home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect class="mark-frame" x="4" y="5" width="20" height="22" rx="4"/><rect class="mark-panel" x="13" y="5" width="15" height="22" rx="4"/><path class="mark-handle" d="M17 14v4"/></svg><span class="rail-label" data-i18n="首頁">Home</span></button><div class="rail-divider"></div>
<div class="pads" id="pads"></div>
<button class="icon add rail-control" id="add" title="Add site ⌘T" data-i18n-title="新增網站 ⌘T" aria-label="Add site" data-i18n-aria-label="新增網站"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="rail-label" data-i18n="新增">Add</span></button>
<div class="rail-divider"></div><div class="rail-bottom">
<button class="icon rail-control" id="settings" title="Settings" data-i18n-title="設定" aria-label="Settings" data-i18n-aria-label="設定"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg><span class="rail-label" data-i18n="設定">Settings</span></button>
<button class="icon collapse rail-control" data-action="hide" title="Hide sidebar ⌘W" data-i18n-title="收合側欄 ⌘W" aria-label="Hide sidebar" data-i18n-aria-label="收合側欄"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg><span class="rail-label" data-i18n="收合">Hide</span></button></div>
</aside>
<header class="toolbar">
<div class="nav"><button class="icon" id="back" data-action="back" title="Back" data-i18n-title="上一頁" aria-label="Back" data-i18n-aria-label="上一頁" disabled><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><button class="icon" id="forward" data-action="forward" title="Forward" data-i18n-title="下一頁" aria-label="Forward" data-i18n-aria-label="下一頁" disabled><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button><button class="icon reload" id="reload" data-action="reload" title="Reload" data-i18n-title="重新整理" aria-label="Reload" data-i18n-aria-label="重新整理"><svg class="icon-reload" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-1 4M20 12a7 7 0 0 0-12-5"/></svg><svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
<form class="address-form" id="address-form"><div class="address-wrap"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c4 4 4 8 0 12M8 2c-4 4-4 8 0 12"/></svg><input id="address" aria-label="Address or search" data-i18n-aria-label="網址或搜尋" placeholder="Search or enter a URL" data-i18n-placeholder="搜尋或輸入網址" autocomplete="off" spellcheck="false"></div></form>
<button class="icon pin" id="pin" data-action="pin" title="Pin: keep the sidebar open" data-i18n-title="釘選：離開時不收合" aria-label="Pin sidebar" data-i18n-aria-label="釘選側欄"><svg viewBox="0 0 24 24"><path d="m8 3 8 0-1 7 3 3v2H6v-2l3-3-1-7ZM12 15v6"/></svg></button>
<button class="icon external" id="external" data-action="external" title="Open in default browser" data-i18n-title="在預設瀏覽器開啟" aria-label="Open in default browser" data-i18n-aria-label="在預設瀏覽器開啟"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M10 4H4v16h16v-6"/></svg></button>
<div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Page loading" data-i18n-aria-label="網頁載入進度" hidden><i id="progress-bar"></i></div>
</header>
<main class="stage" id="stage"><section class="home" id="home">
<div class="home-heading"><div><h1><span id="home-title">My sites</span> <span id="site-count" class="count">0</span></h1><p class="lead" id="home-lead"></p></div><button class="primary" id="hero-add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="新增網站">Add site</span></button></div>
<p id="site-limit" class="hint" role="status" hidden></p>
<div class="home-tools" id="home-tools"><label class="site-filter-wrap" for="site-filter"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only" data-i18n="搜尋網站">Search sites</span><input id="site-filter" type="search" placeholder="Search name or URL" data-i18n-placeholder="搜尋名稱或網址" autocomplete="off" spellcheck="false"></label><button class="text-button" id="manage-sites" type="button"><span data-i18n="管理網站">Manage sites</span></button></div>
<p id="site-no-results" class="no-results" role="status" hidden><span data-i18n="找不到符合的網站">No matching sites</span><button id="clear-site-filter" class="pill" type="button"><span data-i18n="清除搜尋">Clear search</span></button></p>
<div id="saved-sites" class="saved-sites" aria-label="Saved sites" data-i18n-aria-label="已加入的網站"></div>
<div class="empty-state" id="empty-state"><p><span data-i18n="按「新增網站」貼上網址，或從下方選一個網站。">Choose “Add site” to paste a URL, or pick a site below.</span></p><button class="pill" id="empty-import"><span data-i18n="從 Chrome 匯入書籤">Import Chrome bookmarks</span></button></div>
<details class="suggestions" id="suggestions" open><summary><span data-i18n="加入常用服務">Add a popular service</span> <span><span data-i18n="快速加入">Quick add</span></span></summary><div class="grid" id="quick"></div></details>
<div class="home-help"><div><span data-i18n="顯示／收合側欄">Show / hide sidebar</span><kbd id="home-shortcut">⌘ ⇧ Space</kbd></div><p id="home-open-help"></p><p id="home-hide-help"></p><button class="pill" id="home-pin" type="button"></button></div>
<div class="version">Open Slide Pad <span id="app-version"></span></div>
</section>
<section class="load-error" id="load-error" aria-live="polite" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="17"/><path d="M24 15v11M24 32v1"/></svg><h2 id="load-error-title"></h2><p id="load-error-detail"></p><p class="address-hint" id="load-error-address"></p><div class="load-actions"><button class="pill" id="load-dismiss" data-action="dismiss_failure" hidden><span data-i18n="回到原本的頁面">Back to the previous page</span></button><button class="primary" id="load-retry" data-action="reload"><span data-i18n="重試">Try again</span></button><button class="pill" id="load-edit" data-action="focus_address"><span data-i18n="修改網址">Edit address</span></button><button class="pill" id="load-home" data-action="home"><span data-i18n="回首頁">Go home</span></button></div></section>
</main>
<footer class="status" id="status"><span class="status-text" id="status-text"><i class="dot"></i><span data-i18n="首頁">Home</span></span><button id="undo-remove" class="undo-button" data-action="undo_remove" hidden><span data-i18n="復原移除">Undo removal</span></button><span id="status-shortcut">⌘ ⇧ Space</span></footer>
<section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" tabindex="-1" hidden></section><div class="toast" id="toast" role="alert" hidden><span id="toast-text"></span><button class="icon" id="toast-close" type="button" aria-label="Dismiss" data-i18n-aria-label="關閉提示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<button id="resize-grip" class="resize-grip" title="Drag to resize width and height" data-i18n-title="拖曳調整寬度與高度" aria-label="Resize window" data-i18n-aria-label="拖曳調整視窗大小"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M5 15 15 5M10 15l5-5"/></svg></button>
<script>
// SLIDERUST_I18N
// SLIDERUST_SCRIPT
</script>
</body>
</html>
