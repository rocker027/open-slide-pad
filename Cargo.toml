[package]
name = "sliderust"
version = "0.4.3"
edition = "2024"
rust-version = "1.88"
description = "A native WebKit sidebar browser for macOS, built with Rust"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
directories = "6"
tempfile = "3"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tray-icon = { version = "0.21", default-features = false }
global-hotkey = "0.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSScreen", "NSWindow", "NSApplication"] }
objc2-foundation = "0.3"
# wry 已帶入同一版；直接相依只為了啟用它沒開的上一頁／下一頁清單綁定。
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKBackForwardList", "WKBackForwardListItem"] }

[profile.release]
lto = "thin"
strip = true

