name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 固定 toolchain 版本：clippy 每版都會新增 lint，浮動版本會讓未改動的程式碼突然變紅。
      - name: 安裝 Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
      # 不含 --smoke：原生 smoke 需要視窗伺服器並連線 example.com。
      - name: 驗證
        run: ./scripts/verify.sh
